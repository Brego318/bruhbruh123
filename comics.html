<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kobestyaosani – Comics</title>

  <link rel="stylesheet" href="comics.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>
  <script>
    if (!localStorage.getItem("nickname")) {
      window.location.href = "./signin.html";
    }
  </script>

  <!-- Immediate ban check -->
  <script>
    const nickname = localStorage.getItem("nickname");
    const bannedUsers = JSON.parse(localStorage.getItem("bannedUsers") || "[]");
    
    if (nickname && bannedUsers.includes(nickname)) {
      document.write('<!DOCTYPE html><html><head><style>body{margin:0;padding:0;width:100%;height:100vh;display:flex;align-items:center;justify-content:center;background:#000;font-family:"Montserrat", system-ui, Arial, sans-serif;}div{font-size:120px;font-weight:900;color:#FF0000;text-align:center;letter-spacing:10px;text-shadow:0 0 20px rgba(255,0,0,0.8);}</style></head><body><div>BANNED</div></body></html>');
      document.close();
      throw new Error("User is banned");
    }
  </script>
  
  <!-- Background -->
  <div class="bg"></div>

  <!-- Header -->
  <header class="xbrv-orbit-nav">
    <div class="xbrv-logo-slot">
      <a href="index.html"><h1>კობესტყაოსანი</h1></a>
    </div>

    <button class="mobile-menu-toggle" aria-label="Toggle menu">
      <i class="fas fa-bars"></i>
    </button>

    <nav class="xbrv-hyper-links">
      <a href="index.html">მთავარი გვერდი</a>
      <a href="comics.html" class="active">კომიქსი</a>
      <a href="poema.html">პოემა</a>
    </nav>

    <div class="xbrv-auth-zone desktop-auth">
      <button class="xbrv-auth-btn" id="authBtn">SIGN IN</button>
      <div class="xbrv-user-menu" id="userMenu" style="display:none;">
        <div class="xbrv-user-name" id="userName"></div>
      </div>
    </div>
  </header>

  <main class="page">
    <!-- Comics -->
    <section class="panel">
      <div class="panel-head">
        <h1 class="panel-title">კომიქსი</h1>
        <p class="panel-sub">კობესტყაოსნის კომიქსი სერია გამოჩნდება მალე</p>
      </div>

      <div class="comics-grid">
        <!-- Comics will be added here -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p style="font-family:'Noto Serif Georgian', serif;">
      &copy; 2026 კობესტყაოსანი. პოეტი : საბა მელქაძე, პოეტის დამხმარე : ალექსანდრე გუდამათიაშვილი,
      მხატვარი : მათე ათოშვილი, საიტის ამწყობი : ნიკა ბრეგაძე.
    </p>
  </footer>

  <!-- Auth script -->
  <script>
    // Admin nickname for banning users
    const admin_nickname = "admin";
    
    const nickname = localStorage.getItem("nickname");
    const authBtn = document.getElementById("authBtn");
    const userMenu = document.getElementById("userMenu");
    const userName = document.getElementById("userName");

    function initializeAuth() {
      if (nickname) {
        authBtn.style.display = "none";
        userMenu.style.display = "flex";
        userName.textContent = nickname;
        
        // Add admin panel if user is admin
        if (nickname === admin_nickname) {
          const adminPanel = document.createElement("button");
          adminPanel.id = "adminPanelBtn";
          adminPanel.textContent = "⚙️ Admin";
          adminPanel.style.cssText = "margin-left: 12px; padding: 8px 12px; background: #D97D45; color: white; border: none; border-radius: 6px; font-weight: 800; font-size: 12px; cursor: pointer;";
          userMenu.appendChild(adminPanel);
          adminPanel.addEventListener("click", showAdminPanel);
        }
      } else {
        authBtn.style.display = "block";
        userMenu.style.display = "none";
        // Redirect to signin if not logged in
        window.location.href = "./signin.html";
      }
    }

    authBtn.addEventListener("click", () => {
      window.location.href = "./signin.html";
    });

    function showAdminPanel() {
      const bannedUsers = JSON.parse(localStorage.getItem("bannedUsers") || "[]");
      const banList = bannedUsers.join("\n") || "No banned users";
      const newBans = prompt("Current banned users:\n\n" + banList + "\n\nEnter usernames to ban (comma-separated):", "");
      
      if (newBans !== null) {
        const usersToAdd = newBans.split(",").map(u => u.trim()).filter(u => u && u !== admin_nickname);
        const updated = [...new Set([...bannedUsers, ...usersToAdd])];
        localStorage.setItem("bannedUsers", JSON.stringify(updated));
        alert("Ban list updated!");
      }
    }

    initializeAuth();
  </script>
</body>
</html>
