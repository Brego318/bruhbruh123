</head>
<body>

     <div class="page-curtain" id="curtain"></div>


    <header class="xbrv-orbit-nav">
        <div class="xbrv-logo-slot">
            <a href="index.html"><h1>კობესტყაოსანი</h1></a>

        <nav class="xbrv-hyper-links">

    </header>

  <main>
      <!-- MAIN CONTACT ZONE -->
    <section class="neon-city-shell">
      <div style="max-width:900px;margin:60px auto;padding:20px;color:white;">

  <!-- Chapter Title -->
  <h1 id="title" style="font-family:'Noto Serif Georgian', serif;"></h1>

  <!-- Chapter Text -->
  <div id="content" style="margin-top:30px;line-height:1.8;font-size:18px;"></div>

  <!-- Locked / Error Message -->
  <div id="status" style="
    margin-top:40px;
    padding:20px;
    border-radius:12px;
    background:#111;
    color:#aaa;
    display:none;
    text-align:center;
  "></div>

  </div>

    </section>

  </main>


  <footer>
    <div class="footer">
        <p style="font-family: 'Noto Serif Georgian', serif;">&copy; 2026 კობესტყაოსანი. პოეტი : საბა მელქაძე, პოეტის დამხმარე : ალექსანდრე გუდამათიაშვილი, მხატვარი : მათე ათოშვილი, საიტის ამწყობი : ნიკა ბრეგაძე.</p>
    </div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBd7OSQKhHA-iY4ET5JQOF-PDwb-fIQ46Y",
      authDomain: "kobestyaosani.firebaseapp.com",
      projectId: "kobestyaosani",
      storageBucket: "kobestyaosani.firebasestorage.app",
      messagingSenderId: "30467496929",
      appId: "1:30467496929:web:2d49f73e90388c2fcd10a0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const titleEl = document.getElementById("title");
    const contentEl = document.getElementById("content");
    const statusEl = document.getElementById("status");

    const id = new URLSearchParams(location.search).get("id");

    if (!id) {
      statusEl.style.display = "block";
      statusEl.textContent = "Missing chapter id. Open like: chapter.html?id=1";
      throw new Error("Missing id");
    }

    try {
      const snap = await getDoc(doc(db, "chapters", String(id)));

      // if doc doesn't exist
      if (!snap.exists()) {
        statusEl.style.display = "block";
        statusEl.textContent = `Chapter ${id} not found.`;
        throw new Error("Not found");
      }

      const ch = snap.data();
      titleEl.textContent = ch.title || `Chapter ${id}`;
      contentEl.innerHTML = ch.content || "";

    } catch (e) {
      // This is what happens when isPublic=false and rules block read
      titleEl.textContent = "";
      contentEl.innerHTML = "";
      statusEl.style.display = "block";
      statusEl.textContent = "🔒 This chapter is locked. Come back later.";
      console.error(e);
    }
  </script>

  <script>
  const curtain = document.getElementById("curtain");
  const DURATION = 420; // must match CSS transition time

  // OPEN when page appears (including back/forward cache)
  window.addEventListener("pageshow", () => {
    // small delay so browser paints the closed curtain first
    requestAnimationFrame(() => {
      requestAnimationFrame(() => curtain.classList.add("is-open"));
    });
  });

  // CLOSE on internal link click, then navigate
  document.addEventListener("click", (e) => {
    const a = e.target.closest("a");
    if (!a) return;

    const url = new URL(a.href, location.href);

    const isSameOrigin = url.origin === location.origin;
    const isModifiedClick = e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0;
    const isAnchorOnly = url.pathname === location.pathname && url.hash;

    if (!isSameOrigin || isModifiedClick || a.target === "_blank" || a.hasAttribute("download") || isAnchorOnly) return;

    e.preventDefault();

    curtain.classList.remove("is-open"); // go CLOSED (covers)
    setTimeout(() => {
      location.href = a.href;
    }, DURATION);
  });
</script>

</body>
</html>
