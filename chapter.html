<html lang="en">
<head>

  <link rel="stylesheet" href="chapter.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Put this in the <head> of index.html, poema.html, etc. -->
  <script>
    if (!localStorage.getItem("nickname")) {
      window.location.href = "signin.html"; // Force them to pick a name
    }
  </script>

  <div class="bg"></div>


  <!-- Header -->
  <header class="xbrv-orbit-nav">
    <div class="xbrv-logo-slot">
      <a href="index.html"><h1>კობესტყაოსანი</h1></a>
    </div>

    <button class="mobile-menu-toggle" aria-label="Toggle menu">
      <i class="fas fa-bars"></i>
    </button>

    <nav class="xbrv-hyper-links">
      <a href="index.html">მთავარი გვერდი</a>
      <a href="comics.html">კომიქსი</a>
      <a href="poema.html" class="active">პოემა</a>
    </nav>

    <div class="xbrv-auth-zone desktop-auth">
      <button class="xbrv-auth-btn" id="authBtn">SIGN IN</button>
      <div class="xbrv-user-menu" id="userMenu" style="display:none;">
        <div class="xbrv-user-name" id="userName"></div>
      </div>
    </div>
  </header>

  <main class="page">
    <!-- Reading panel -->
    <section class="reader panel">
      <div class="reader-top">
        <a class="back-link" href="poema.html">
          <i class="fa-solid fa-arrow-left"></i>
          უკან თავებზე
        </a>

        <div class="reader-tools">
          <button class="tool" id="smallerBtn" type="button" title="Smaller text">A−</button>
          <button class="tool" id="biggerBtn" type="button" title="Bigger text">A+</button>
        </div>
      </div>

      <h1 id="title" class="chapter-title"></h1>

      <!-- If locked / missing id / not found, show this -->
      <div id="status" class="status-card" style="display:none;"></div>

      <!-- Chapter content goes here -->
      <article id="content" class="chapter-content"></article>

      <div class="chapter-navigation">
        <button id="nextChapterBtn" class="next-chapter-btn">შემდეგი გვერდი →</button>
      </div>
    </section>

    <footer class="mini-footer">
      <p>თუ გვერდი არ იტვირთება — სცადე refresh.</p>
    </footer>
  </main>

  <!-- Firebase load chapter -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBd7OSQKhHA-iY4ET5JQOF-PDwb-fIQ46Y",
      authDomain: "kobestyaosani.firebaseapp.com",
      projectId: "kobestyaosani",
      storageBucket: "kobestyaosani.firebasestorage.app",
      messagingSenderId: "30467496929",
      appId: "1:30467496929:web:2d49f73e90388c2fcd10a0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const titleEl = document.getElementById("title");
    const contentEl = document.getElementById("content");
    const statusEl = document.getElementById("status");

    const id = new URLSearchParams(location.search).get("id");

    function showStatus(text){
      statusEl.style.display = "block";
      statusEl.textContent = text;
    }

    if (!id) {
      titleEl.textContent = "";
      contentEl.innerHTML = "";
      showStatus("Missing chapter id. Open like: chapter.html?id=1");
      throw new Error("Missing id");
    }

    try {
      const snap = await getDoc(doc(db, "chapters", String(id)));

      if (!snap.exists()) {
        titleEl.textContent = "";
        contentEl.innerHTML = "";
        showStatus(`Chapter ${id} not found.`);
        throw new Error("Not found");
      }

      const ch = snap.data();

      titleEl.textContent = ch.title || `Chapter ${id}`;

      // supports content OR text OR body
      const raw =
        (typeof ch.content === "string" && ch.content) ||
        (typeof ch.text === "string" && ch.text) ||
        (typeof ch.body === "string" && ch.body) ||
        "";

      if (!raw) {
        contentEl.innerHTML = "";
        showStatus("⚠️ No content found in Firestore (expected field: content).");
      } else {
        statusEl.style.display = "none";
        // If your content is plain text (no <p> tags), preserve new lines:
        const looksLikeHtml = /<\/?[a-z][\s\S]*>/i.test(raw);
        contentEl.innerHTML = looksLikeHtml ? raw : raw.replace(/\n/g, "<br>");
      }

    } catch (e) {
      titleEl.textContent = "";
      contentEl.innerHTML = "";
      showStatus("🔒 ეს თავი ჩაკეტილია. დაბრუნდი მოგვიანებით.");
      console.error(e);
    }
  </script>

  <!-- Text size controls -->
  <script>
    const content = document.getElementById("content");
    const key = "chapterFontSize";
    const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

    function setSize(px){
      content.style.fontSize = px + "px";
      localStorage.setItem(key, String(px));
    }

    const saved = Number(localStorage.getItem(key));
    if (saved) setSize(clamp(saved, 16, 24));

    document.getElementById("smallerBtn").addEventListener("click", () => {
      const cur = parseFloat(getComputedStyle(content).fontSize);
      setSize(clamp(cur - 1, 16, 24));
    });

    document.getElementById("biggerBtn").addEventListener("click", () => {
      const cur = parseFloat(getComputedStyle(content).fontSize);
      setSize(clamp(cur + 1, 16, 24));
    });
  </script>

  <!-- Next Chapter Navigation -->
  <script>
    const currentId = Number(new URLSearchParams(location.search).get("id")) || 1;
    const nextBtn = document.getElementById("nextChapterBtn");
    const maxChapters = 12;

    if (currentId >= maxChapters) {
      nextBtn.disabled = true;
      nextBtn.style.opacity = "0.5";
      nextBtn.style.cursor = "not-allowed";
      nextBtn.textContent = "ბოლო თავი";
    } else {
      nextBtn.addEventListener("click", () => {
        const nextId = currentId + 1;
        window.location.href = `chapter.html?id=${nextId}`;
      });
    }
  </script>

  <script type="module" src="./auth.js"></script>
  <script type="module" src="./global-ban.js"></script>
</body>
</html>
