<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

   <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@100..900&display=swap" rel="stylesheet">
      <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@400;700;900&display=swap" rel="stylesheet">

<body>

  <!-- Background overlay for header + main -->
  <div class="bg-hero"></div>

  <header class="site-header">
    <a class="brand" href="index.html">კობესტყაოსანი</a>

    <nav class="nav">
      <a href="index.html" class="active">მთავარი გვერდი</a>
      <a href="comics.html">კომიქსი</a>
      <a href="poema.html">პოემა</a>
    </nav>

    <div class="auth-container">
      <button class="sign-in-btn" id="authBtn">SIGN IN</button>
      <div class="user-menu" id="userMenu" style="display:none;">
        <div class="user-name" id="userName"></div>
        <button class="logout-btn" id="logoutBtn">Logout</button>
      </div>
    </div>
  </header>

  <main class="hero">
    <section class="hero-inner">
      <!-- left image -->
      <div class="hero-media">
        <img src="სურათები/image.png" alt="Artwork" />
      </div>

      <!-- right text -->
      <div class="hero-copy">
        <h2>კობესტყაოსანი</h2>
        <p>
          რაჭის ლამაზსა ქალაქში <br>
კობე ერთია ათასში
        </p>

        <a class="cta" href="poema.html">წაიკითხე სრულად</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 კობესტყაოსანი. პოეტი : საბა მელქაძე, პოეტის დამხმარე : ალექსანდრე გუდამათიაშვილი, მხატვარი : მათე ათოშვილი, საიტის ამწყობი : ნიკა ბრეგაძე.</p>
  </footer>

  
  <script>
  // Check if user is logged in
  const nickname = localStorage.getItem("nickname");
  const authBtn = document.getElementById("authBtn");
  const userMenu = document.getElementById("userMenu");
  const userName = document.getElementById("userName");
  const logoutBtn = document.getElementById("logoutBtn");

  function initializeAuth() {
    if (nickname) {
      authBtn.style.display = "none";
      userMenu.style.display = "block";
      userName.textContent = nickname;
    } else {
      authBtn.style.display = "block";
      userMenu.style.display = "none";
    }
  }

  authBtn.addEventListener("click", () => {
    window.location.href = "./signin.html";
  });

  logoutBtn.addEventListener("click", () => {
    localStorage.removeItem("nickname");
    window.location.href = "./signin.html";
  });

  initializeAuth();
    </script>


</body>
</html>
