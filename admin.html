<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin – Chapter Control</title>
  <style>
    body{font-family:system-ui,Arial;max-width:720px;margin:40px auto;padding:0 16px}
    .card{border:1px solid #ddd;border-radius:12px;padding:16px;margin:14px 0}
    input,button{padding:10px 12px;border-radius:10px;border:1px solid #ccc;font-size:14px}
    button{cursor:pointer}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .danger{background:#111;color:#fff;border-color:#111}
    .ok{background:#0b5;color:#fff;border-color:#0b5}
    small{color:#666}
    #msg{white-space:pre-wrap;margin-top:10px}
  </style>
</head>
<body>

<h1>Admin Chapter Control</h1>

<div class="card">
  <h3>1) Admin Login (secure)</h3>
  <div class="row">
    <input id="email" type="email" placeholder="Admin email" />
    <input id="pass" type="password" placeholder="Password" />
    <button id="loginBtn" class="danger">Login</button>
    <button id="logoutBtn">Logout</button>
  </div>
  <small>You must login so Firestore rules allow block/unblock.</small>
</div>

<div class="card">
  <h3>2) Block / Unblock a chapter</h3>

  <div class="row">
    <input id="adminNick" placeholder="Admin nickname (optional UI)" />
    <input id="chapterId" inputmode="numeric" placeholder="Chapter (1-12)" />
  </div>

  <div class="row" style="margin-top:10px">
    <button id="blockBtn" class="danger">Block</button>
    <button id="unblockBtn" class="ok">Unblock</button>
    <button id="checkBtn">Check status</button>
  </div>

  <div id="msg"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
  import {
    getFirestore, doc, getDoc, updateDoc
  } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

    const firebaseConfig = {
    apiKey: "AIzaSyBd7OSQKhHA-iY4ET5JQOF-PDwb-fIQ46Y",
    authDomain: "kobestyaosani.firebaseapp.com",
    projectId: "kobestyaosani",
    storageBucket: "kobestyaosani.firebasestorage.app",
    messagingSenderId: "30467496929",
    appId: "1:30467496929:web:2d49f73e90388c2fcd10a0",
    measurementId: "G-FZ6FEW3G19"
    };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  const $ = (id) => document.getElementById(id);
  const msg = (t) => $("msg").textContent = t;

  function getChapterInput(){
    const raw = $("chapterId").value.trim();
    if (!raw) throw new Error("Enter chapter number (1-12).");
    // keep IDs as strings: "1", "2", ...
    const n = Number(raw);
    if (!Number.isInteger(n) || n < 1 || n > 12) throw new Error("Chapter must be 1–12.");
    return String(n);
  }

  async function requireAdmin(){
    const user = auth.currentUser;
    if (!user) throw new Error("Login first.");
    // check admin doc exists
    const adminRef = doc(db, "admins", user.uid);
    const adminSnap = await getDoc(adminRef);
    if (!adminSnap.exists()) throw new Error("Not an admin account.");
  }

  $("loginBtn").onclick = async () => {
    try{
      msg("");
      await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value);
      msg("Logged in ✅");
    }catch(e){
      msg("Login failed: " + e.message);
    }
  };

  $("logoutBtn").onclick = async () => {
    await signOut(auth);
    msg("Logged out.");
  };

  onAuthStateChanged(auth, (user) => {
    if (user) msg("Signed in as: " + user.email);
  });

  $("blockBtn").onclick = async () => {
    try{
      msg("");
      await requireAdmin();
      const id = getChapterInput();
      await updateDoc(doc(db, "chapters", id), { isPublic: false });
      msg(`Chapter ${id} is now BLOCKED 🔒`);
    }catch(e){
      msg("Error: " + e.message);
    }
  };

  $("unblockBtn").onclick = async () => {
    try{
      msg("");
      await requireAdmin();
      const id = getChapterInput();
      await updateDoc(doc(db, "chapters", id), { isPublic: true });
      msg(`Chapter ${id} is now UNBLOCKED ✅`);
    }catch(e){
      msg("Error: " + e.message);
    }
  };

  $("checkBtn").onclick = async () => {
    try{
      msg("");
      const id = getChapterInput();
      const snap = await getDoc(doc(db, "chapters", id));
      if (!snap.exists()) return msg(`Chapter ${id} not found in Firestore.`);
      const ch = snap.data();
      msg(`Chapter ${id} status: ${ch.isPublic ? "UNBLOCKED ✅" : "BLOCKED 🔒"}`);
    }catch(e){
      msg("Error: " + e.message);
    }
  };
</script>



</body>
</html>
